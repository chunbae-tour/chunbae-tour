spring:
  application:
    name: chunbae-tour
  profiles:
    active: local

  # Graceful shutdown (배포 S0, KAN-226): 종료 신호(SIGTERM) 수신 시 새 요청은 거부하되
  # 진행 중인 요청은 최대 timeout-per-shutdown-phase까지 마저 처리한 뒤 종료한다.
  # blue/green 무중단 배포에서 구 컨테이너를 내릴 때 결제/환불/PortOne 웹훅 같은 처리 중 요청이
  # 강제 중단되지 않도록 하는 전제. (server.shutdown=graceful와 함께 동작)
  # ⚠️ 본 설정만으로 "무중단"이 완성되지 않는다 — 현재(S0)는 graceful 종료 '설정만' 적용된 상태다.
  #    실제 무중단은 ① Dockerfile exec-form ENTRYPOINT(SIGTERM→PID1 JVM 직접 전달)
  #    ② 배포 스크립트 docker stop -t 25(= 본 20s보다 큰 stop timeout)
  #    ③ LB target drain/health check 전환이 함께 적용돼야 보장된다(S1/S5에서 완성).
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # KAN-178 Flyway 도입 후 전 환경 validate 고정. 절대 create/update 사용 금지.
      # 신규 entity 추가/컬럼 변경 시에는 Flyway migration(V{N}__{설명}.sql)을 PR에 동봉 → entity ↔ DB 일치 검증.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  servlet:
    multipart:
      max-file-size: 10MB   # 서비스 레벨 문서 10MB cap과 일치 — 초과 시 MaxUploadSizeExceededException → 400
      max-request-size: 10MB

  # Flyway 마이그레이션 (KAN-178, Admin Epic KAN-177 S00).
  # baseline-on-migrate=true + baseline-version=1: 기존 운영 prod DB는 V1 적용된 것으로 간주 (schema 변경 0).
  #   → 첫 배포 시 Flyway가 flyway_schema_history 테이블만 신설 + V1 row 기록. 이후 V2~ 자동 적용.
  # validate-on-migrate=true: 적용 이력과 V파일 checksum 불일치 시 부팅 차단 (의도치 않은 V파일 수정 방지).
  # 빈 DB (local/dev/CI testcontainers)는 V1__baseline.sql이 그대로 실행됨.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

# Tomcat RemoteIpValve 활성화 — trusted internal proxy에서 전달된 X-Forwarded-For를 반영.
# 본 설정은 최소 조치이며 완전한 Trusted Proxy allowlist 해결이 아님.
# 운영 LB가 기본 internal-proxies 정규식(RFC 1918 사설 IP regex)에 포함되지 않으면
# server.tomcat.remoteip.internal-proxies regex를 별도 설정해야 함.
server:
  port: 8080
  forward-headers-strategy: NATIVE
  # Graceful shutdown 활성화 (배포 S0, KAN-226). 기본값 immediate(즉시 강제 종료)에서 graceful로 전환.
  # SIGTERM 시 톰캣이 새 connection 수락을 멈추고, 진행 중 요청을 spring.lifecycle.timeout-per-shutdown-phase까지 대기.
  shutdown: graceful

jwt:
  secret: ${JWT_SECRET}
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT30M}
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P7D}

# Refresh Token 쿠키 정책 공통 기본값.
# - secure는 프로파일별로 오버라이드: local=false (HTTP 허용), prod=true (HTTPS 강제).
# - same-site는 환경변수로 오버라이드 (KAN-125 S5). 운영 프론트엔드/백엔드 도메인 정합에 따라 Lax/None 결정.
#   default=Lax (same-site 배치 권장). cross-site 운영 시 prod 배포 환경에서 COOKIE_SAMESITE=None 주입.
#   None 사용 시 secure=true 필수 (CookieProperties compact ctor가 강제). 의사결정: docs/operations/samesite-policy.md
cookie:
  refresh-token:
    name: refreshToken
    secure: false
    same-site: ${COOKIE_SAMESITE:Lax}
    path: /api/v1/auth

# CORS 정책.
# allowed-origins는 프로파일별로 오버라이드 — 와일드카드(*) 금지 (allow-credentials=true와 호환 불가)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  allowed-headers: Authorization,Content-Type,Accept,Idempotency-Key
  allow-credentials: true
  max-age: PT1H

# Rate Limit 정책 (sa-docs/11 운영 보안 정책 §Rate Limit).
# enabled=false면 RateLimitFilter가 모든 요청을 즉시 통과 — 로컬 개발/장애 대응 토글.
# window는 1초 이상 ISO-8601 Duration (RateLimitPolicy compact constructor가 강제).
# 정책 순서가 매칭 우선순위 — 구체적인 패턴 위, 일반 패턴 아래.
ratelimit:
  enabled: ${RATELIMIT_ENABLED:true}
  endpoints:
    - id: signup
      method: POST
      path: /api/v1/users/auth/signup
      limit: 3
      window: PT10M
    - id: user-login
      method: POST
      path: /api/v1/users/auth/login
      limit: 5
      window: PT1M
    - id: merchant-login
      method: POST
      path: /api/v1/merchants/auth/login
      limit: 5
      window: PT1M
    - id: admin-login
      method: POST
      path: /api/v1/admin/auth/login
      limit: 5
      window: PT1M
    # 소셜 로그인 — 외부 API(카카오/네이버) quota + 신규가입 스팸 방어. RateLimitFilter는 findFirst라
    #   exact(signup)을 wildcard(login)보다 먼저 선언해 우선 매칭시킨다(/oauth/* 가 /oauth/signup도 매칭하므로).
    - id: oauth-signup
      method: POST
      path: /api/v1/users/auth/oauth/signup
      limit: 5
      window: PT10M
    - id: oauth-login
      method: POST
      path: /api/v1/users/auth/oauth/*
      limit: 10
      window: PT1M
    # 상인 소셜 로그인 — USER oauth-login과 동일하게 외부 API quota + oauthId 계정 탐침 방어(미인증 진입점).
    - id: merchant-oauth-login
      method: POST
      path: /api/v1/merchants/auth/oauth/*
      limit: 10
      window: PT1M
    - id: translation
      method: POST
      path: /api/v1/translations
      limit: 15
      window: PT1M
    # 신고 접수: 한 사용자가 여러 대상을 빠르게 신고(report-bombing)해 관리자 큐를 도배하거나
    #   다계정 협업으로 자동숨김 임계(3건)를 노리는 남용 방어. uk_reports_reporter_target은 같은 대상
    #   중복만 막아 다른 대상 연속 신고는 차단 못 함 → IP당 한도로 보완. 정상 사용자는 분당 10건 신고할 일 없음.
    - id: report-create
      method: POST
      path: /api/v1/reports
      limit: 10
      window: PT1M
    - id: qr-status-poll
      method: GET
      path: /api/v1/payments/qr/*/status
      limit: 30
      window: PT1M
    # 가게 이미지 업로드(E10): 인증 상인이 5MB 파일을 무제한 업로드해 S3 비용/고아 객체 누적시키는 것 방지(hyeonmin02 리뷰).
    #   업로드와 키 영속화가 분리돼 후속 저장 없이도 객체가 쌓이므로 별도 한도 필요. IP 기반(현 RateLimitFilter) —
    #   userId 식별 기반 제한은 사용자 식별 rate-limit 도입 시 재검토(token-reissue 주석과 동일 trade-off).
    - id: shop-image-upload
      method: POST
      path: /api/v1/merchants/me/shops/*/images
      limit: 20
      window: PT1H
    # 채팅 파일/이미지 업로드(KAN-309): shop-image-upload와 동일한 이유 — 업로드와 메시지 전송이 분리된
    #   2-step 구조라 전송 없이도 S3 객체가 누적될 수 있음. IP 기반 제한.
    - id: chat-file-upload
      method: POST
      path: /api/v1/chat/rooms/*/files
      limit: 20
      window: PT1H
    # 상담 채팅 파일/이미지 업로드(KAN-310): shop-image-upload와 동일한 이유 — 업로드와 메시지 전송이 분리된
    #   2-step 구조라 전송 없이도 S3 객체가 누적될 수 있음. IP 기반 제한.
    - id: support-file-upload
      method: POST
      path: /api/v1/support/rooms/*/files
      limit: 20
      window: PT1H
    - id: admin-support-file-upload
      method: POST
      path: /api/v1/admin/support/rooms/*/files
      limit: 20
      window: PT1H
    # 토큰 재발급: permitAll + 자동 전송 refresh 쿠키만으로 호출 가능한 경로라 무제한 노출되면
    #   (1) 프론트 인터셉터의 401→reissue 재시도 루프 오작동, (2) 탈취 refresh 쿠키 brute 시도를 막지 못한다.
    #   IP당 분당 20회 — 정상 SPA의 access TTL 만료 주기(분 단위 1회)에 비해 충분히 여유 있으면서 폭주는 차단.
    #   (IP 기반 한도라 같은 NAT 공유 사용자 다수가 한 bucket을 공유하는 trade-off는 기존 login 정책과 동일.
    #    단 reissue는 "막혀도 재로그인으로 복구 가능"해 login과 동일 모델 수용. 20회 한도로 일반 공유망은 여유.)
    - id: token-reissue
      method: POST
      path: /api/v1/auth/reissue
      limit: 20
      window: PT1M
    - id: nearby-category
      method: GET
      path: /api/v1/places/*/nearby-places
      limit: 30
      window: PT1M
    - id: geocoding
      method: GET
      path: /api/v1/places/geocoding
      limit: 30
      window: PT1M
    - id: reverse-geocoding
      method: GET
      path: /api/v1/places/region
      limit: 30
      window: PT1M
    - id: search-suggest
      method: GET
      path: /api/v1/search/suggest
      limit: 30
      window: PT1M
    - id: place-map-markers
      method: GET
      path: /api/v1/places/map-markers
      limit: 30
      window: PT1M
    # 로그아웃: rate-limit 미적용(의도). logout은 인증(Bearer) 필수 + 효과가 "자기 토큰 폐기"로 자기 자신에만
    #   국한돼 남용 가치가 거의 없다. 반대로 IP 기반 한도를 걸면 같은 NAT/회사망/모바일망 공유 사용자 중 한 명의
    #   반복 호출이 타 사용자의 정상 로그아웃을 막아 "실패시키면 더 불편한" 동작을 악화시킨다(hyeonmin02 리뷰).
    #   → 정책 미추가. 추후 JWT 이후 사용자 식별 기반 rate-limit이 도입되면 그 위에서 재검토.

portone:
  secret: ${PORTONE_SECRET}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET}
  store-id: ${PORTONE_STORE_ID}
  base-url: https://api.portone.io
  channel:
    card: ${PORTONE_CHANNEL_CARD:}
    kakao-pay: ${PORTONE_CHANNEL_KAKAO_PAY:}
    toss-pay: ${PORTONE_CHANNEL_TOSS_PAY:}
    foreign-card: ${PORTONE_CHANNEL_FOREIGN_CARD:}

# Actuator + Micrometer Prometheus (KAN-104 인증 필터 성능 모니터링).
# - health/info: 외부 LB health check 허용 (SecurityConfig가 permitAll 매핑)
# - prometheus: Grafana/Datadog 등이 메트릭 수집. 운영에서는 internal-only (SecurityConfig + IP allowlist 후속 작업)
# - 그 외 env/beans/mappings 등은 노출 금지 (보안: 정보 노출 차단)
# metrics.tags는 모든 메트릭에 application/env 라벨 자동 추가 → Prometheus query 시 필터링/그룹핑 일관
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: chunbae-tour
      env: ${SPRING_PROFILES_ACTIVE:local}

report:
  auto-hide:
    # 누적 신고 수 임계값 — 이 값 이상이면 콘텐츠 자동 숨김 (기본값 3)
    # 배포 없이 운영 중 조정 가능 (AWS 환경변수 또는 application-prod.yml 오버라이드)
    threshold: ${REPORT_AUTO_HIDE_THRESHOLD:3}

app:
  encryption:
    # 정산 계좌번호 AES-128 암호화 키 — 반드시 정확히 16바이트(AES-128 key size).
    # ACCOUNT_ENCRYPTION_KEY 환경변수 미설정 시 Spring 부팅 실패 — 기본값 없음.
    account-key: ${ACCOUNT_ENCRYPTION_KEY}

google:
  translation:
    api-key: ${GOOGLE_TRANSLATION_API_KEY:}

kakao:
  map:
    api-key: ${KAKAO_MAP_API_KEY:}
    coord2address-url: https://dapi.kakao.com/v2/local/geo/coord2address.json
    coord2regioncode-url: https://dapi.kakao.com/v2/local/geo/coord2regioncode.json
    category-search-url: https://dapi.kakao.com/v2/local/search/category.json
    address-search-url: https://dapi.kakao.com/v2/local/search/address.json
    keyword-search-url: https://dapi.kakao.com/v2/local/search/keyword.json
    map-url: https://map.kakao.com/link/from

# 소셜 로그인(카카오/네이버) OAuth.
# client-id/secret 미설정(빈값)이어도 부팅은 정상 — 소셜 로그인 '호출' 시점에만 필요(SecretValidator 미강제).
#   → 키 없는 환경(현 prod 등)도 부팅 영향 없음. 소셜 로그인 사용하려면 배포 env에 키 주입 + 공급자 콘솔에
#     Redirect URI 등록 필수.
# KAKAO_LOGIN_REST_API_KEY: 카카오 Developers 앱(카카오 로그인 활성화)의 REST API 키.
#   지도와 같은 앱이면 KAKAO_MAP_API_KEY와 동일 값을 넣어도 됨.
oauth:
  kakao:
    client-id: ${KAKAO_LOGIN_REST_API_KEY:}
    client-secret: ${KAKAO_LOGIN_CLIENT_SECRET:}
    token-url: https://kauth.kakao.com/oauth/token
    user-info-url: https://kapi.kakao.com/v2/user/me
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
    token-url: https://nid.naver.com/oauth2.0/token
    user-info-url: https://openapi.naver.com/v1/nid/me

tour-api:
  service-key: ${TOUR_API_SERVICE_KEY:}
  base-url: https://api.data.go.kr/openapi/tn_pubr_public_cltur_fstvl_api
  sync-cron: "0 0 2 * * *"

  # KAN-221 관광지: 한국관광공사 국문 관광정보 서비스(KorService2).
  # 전용 키 분리 — 축제(TOUR_API_SERVICE_KEY)·전통시장(PUBLIC_DATA_MARKET_KEY)과 다른 data.go.kr 계정/활용신청을
  # 쓸 수 있으므로 독립 env로 둔다(키 교체가 서로 영향 없게). KorService2 활용신청한 계정의 키를 주입할 것.
  kor-service:
    service-key: ${TOUR_API_KOR_SERVICE_KEY:}
    base-url: https://apis.data.go.kr/B551011/KorService2
    # 관광지 전수 수집 스케줄 — 매일 04시 (축제 02시와 분산해 외부 API 부하/한도 충돌 회피)
    place-sync-cron: "0 0 4 * * *"

public-data:
  market:
    url: ${PUBLIC_DATA_MARKET_URL:https://api.data.go.kr/openapi/tn_pubr_public_trdit_mrkt_api}
    key: ${PUBLIC_DATA_MARKET_KEY:}

# 검색 도메인 설정
search:
  ranking:
    # 인기 검색어 일간 초기화 스케줄 (cron 표현식)
    # 기본값: 매일 자정 (0 0 0 * * *)
    # 재배포 없이 변경 가능하도록 yml로 외부화
    reset-cron: "0 0 0 * * *"

# S3 업로드/조회 (E10). 버킷명·리전은 비밀 아님 → 평문 + env override.
# 자격증명은 운영 ECS task-role 자동(DefaultCredentialsProvider) — 액세스키 설정/하드코딩 없음.
# 버킷 chunbae-tour-uploads는 완전 비공개(public access block all) → 조회는 presigned GET(만료 10분).
aws:
  s3:
    bucket: ${AWS_S3_BUCKET:chunbae-tour-uploads}
    region: ${AWS_REGION:ap-northeast-2}
    presign-expiry: ${AWS_S3_PRESIGN_EXPIRY:PT10M}
