# 로컬 개발 환경 (Docker Compose 기준)
spring:
  datasource:
    url: jdbc:mysql://localhost:3307/chunbae_tour?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:chunbae}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6380
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 2
