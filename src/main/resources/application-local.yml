spring:
  config:
    import: optional:file:.env[.properties]
  flyway:
    out-of-order: false
    validate-on-migrate: false
    locations: classpath:db/migration
    # Flyway MySQL named lock 해제 후 autocommit 복구 시 연결 끊김 버그 우회 (로컬 전용)
    # useLocalSessionState=true: MySQL 드라이버가 autocommit 상태 로컬 추적 → 서버 재전송 없음
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useLocalSessionState=true
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    # KAN-178: ddl-auto는 base application.yml에서 validate로 통일. 로컬도 Flyway migration 의존.
    # 로컬에서 entity 추가/변경 시 V{N+1} migration 파일 PR에 동봉 → 빈 DB testcontainers 부팅 시 자동 적용.
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 2

google:
  translation:
    api-key: ${GOOGLE_TRANSLATION_API_KEY:}
