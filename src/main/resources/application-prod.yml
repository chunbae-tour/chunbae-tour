spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      # 구성 엔드포인트(clustercfg.*) 주입. 단일 샤드라 useSingleServer로 직접 연결(RedisConfig 참고).
      host: ${REDIS_HOST}
      port: 6379
      # ElastiCache(Valkey)는 AUTH 미설정 — 비번 없이 TLS만. 빈값이면 인증 스킵.
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      # 운영 ElastiCache는 in-transit encryption(TLS) 활성화 → rediss:// 강제(Lettuce 자동구성 + RedisConfig Redisson 둘 다 반영).
      ssl:
        enabled: true

# 운영: Refresh 쿠키는 반드시 HTTPS에서만 전송되어야 함 (Secure=true)
cookie:
  refresh-token:
    secure: true

# 운영 CORS: 허용 origin은 환경변수로 주입 필수. 미설정 시 부팅 실패.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# 운영: Swagger UI·API 문서 완전 비활성화. 엔드포인트 목록 외부 노출 차단.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 운영: Rate Limit는 항상 활성화. 로컬 개발 외에는 비활성화 금지 (sa-docs/11).
# 정책 값은 base application.yml 기본값 사용. 변경 필요 시 운영 yml에 endpoints 블록 오버라이드.
ratelimit:
  enabled: true

# 운영: Actuator(특히 /actuator/prometheus)는 main 포트와 분리해 외부 LB가 접근 못하도록 격리한다.
# - port 9090: main 포트(8080)와 다른 포트로 binding → LB는 8080만 노출
# - address 127.0.0.1: loopback에만 binding → 외부 IP에서 도달 불가
# Prometheus scraper는 같은 호스트(sidecar) 또는 SSH 터널/VPN을 통해서만 접근 가능.
# 운영 인프라(별도 호스트의 Prometheus 클러스터)에서 직접 scrape 필요해지면 address를 VPC 내부 IP로 조정.
# ⚠️ TODO(infra): 운영 Prometheus 배포 토폴로지 확정 전까지는 sidecar/SSH 터널 가정. 별도 호스트 클러스터 채택 시
#   1) 본 address를 VPC 내부 IP로 변경 + 2) SecurityConfig hasIpAddress 정책에 해당 CIDR 추가 + 3) ActuatorSecurityIntegrationTest의
#   prometheus_isBlockedFromPrivateNetworkIp 케이스 재검토 (10.x.x.x 차단 가정 깨짐).
# release blocker #149.
management:
  server:
    port: 9090
    # ECS/ALB 전환(E4): ALB Target Group health check가 태스크 ENI IP의 9090/actuator/health를 직접 친다.
    # loopback(127.0.0.1) 바인딩이면 LB가 도달 불가 → 0.0.0.0으로 바인딩한다.
    # 외부 노출 차단은 "바인딩 차단 → SG 차단"으로 이동: app-sg가 9090을 alb-sg에서만 허용(E0/E5).
    # ⚠️ release blocker #149(loopback 격리 가정)는 SG 격리로 대체됨 — ActuatorSecurityIntegrationTest의
    #    prometheus 차단 케이스는 IP 기반 SecurityConfig 정책으로 계속 방어(바인딩과 독립).
    address: 0.0.0.0
  # base application.yml의 exposure(health,info,prometheus)를 운영에서 명시적으로 재선언.
  # base yml이 향후 변경되어도 운영에서 예상치 못한 endpoint 노출이 발생하지 않도록 이중 안전.
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
