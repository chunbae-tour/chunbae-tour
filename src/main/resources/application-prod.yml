spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

# 운영: Refresh 쿠키는 반드시 HTTPS에서만 전송되어야 함 (Secure=true)
cookie:
  refresh-token:
    secure: true

# 운영 CORS: 허용 origin은 환경변수로 주입 필수. 미설정 시 부팅 실패.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# 운영: Rate Limit는 항상 활성화. 로컬 개발 외에는 비활성화 금지 (sa-docs/11).
# 정책 값은 base application.yml 기본값 사용. 변경 필요 시 운영 yml에 endpoints 블록 오버라이드.
ratelimit:
  enabled: true
