name: CD

# ─────────────────────────────────────────────────────────────────────────────
# 운영 배포 파이프라인 (Epic E — ECS Fargate 배포). 구 EC2 ssh 재시작(D2)에서 ECS rolling으로 전환(E8).
#
# 흐름: develop에서 개발/테스트 → develop→main 릴리즈 PR(머지 시 ci.yml 테스트 게이트)
#       → main 머지 = 이 워크플로우 트리거 → 테스트 재게이트 → ECR push(SHA) → ECS rolling 배포.
#
# 사전 인프라(릴리가 AWS 콘솔에서 직접 생성 — 코드 아님):
#   - ECR 프라이빗 리포 chunbae-tour (이미지 태그 immutable)
#   - ECS Cluster(chunbae-cluster1) + Service(chunbae-service) + ALB Target Group(chunbae-tg, health /actuator/health/lb)
#   - GitHub OIDC Identity Provider + IAM Role(chunbae-gha-ecr-push): ECR push +
#     ECS 배포(ecs:RegisterTaskDefinition / UpdateService / DescribeServices / DescribeTaskDefinition) +
#     iam:PassRole(execution/task role 한정, Condition iam:PassedToService=ecs-tasks.amazonaws.com).
#     trust policy를 repo:chunbae-tour/chunbae-tour:ref:refs/heads/main 으로 제한.
#     push 정책에 ecr:DescribeImages 포함 필요(아래 immutable 가드에서 사용).
#
# 시크릿(전부 GH Secrets — 코드에 평문/계정ID 노출 없음):
#   AWS_ROLE_ARN, ECR_REPOSITORY(풀 URI), ECS_CLUSTER, ECS_SERVICE
#   (구 EC2 ssh 방식의 EC2_HOST/EC2_USER/EC2_SSH_KEY는 E8에서 미사용 — 검증 후 제거)
#
# Task Definition: infra/ecs/task-definition.json 이 IaC 정본. render 단계가 image만 SHA로 주입하고,
#   secrets/env/포트(8080·9090)/로그/role 등 나머지 필드는 이 파일 값으로 새 revision 등록된다.
#   ⚠️ 콘솔에서 task-def를 수동 변경하면 다음 배포가 이 파일 값으로 덮어쓴다(IaC 단일 출처).
#
# 이미지 태그 정책(ECR immutable): 커밋 SHA를 태그로 사용 → 커밋마다 고유, 덮어쓰기 없음.
#   immutable 리포라 동일 태그 재push 불가 → 같은 커밋 재배포(워크플로우 재실행) 시
#   push를 건너뛰고 기존 이미지로 deploy(아래 describe-images 가드, 멱등).
#   가변 'latest' 미사용. 롤백 = 이전 task definition revision으로 update-service(콘솔 또는 CLI 1커맨드).
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [ main ]      # main 머지(릴리즈)만 배포. develop/feature는 ci.yml(테스트)만.

# OIDC AssumeRoleWithWebIdentity에 id-token 발급 필요. 그 외 최소 권한.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2      # 비밀 아님 — 서울 리전

# 운영 배포 직렬화 — 동시 실행 방지(이전 배포 끝난 뒤 다음, 진행 중 배포는 취소하지 않음).
concurrency:
  group: cd-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, Push (ECR), Deploy (ECS)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 배포 전 테스트 게이트(방어). 릴리즈 PR에서 이미 통과했더라도 main 직접 push(hotfix)
      # 경로를 위해 한 번 더 강제 — 테스트 깨진 코드가 운영 배포되는 것을 차단한다.
      - name: Test gate (./gradlew test)
        run: ./gradlew test --no-daemon

      # OIDC로 AWS 역할 assume — 장기 Access Key 없음(GH Secret에 AWS 키 저장하지 않음).
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 커밋 SHA 태그로 빌드+push. Dockerfile 멀티스테이지가 bootJar를 내부에서 빌드하므로
      # 별도 gradle assemble 불필요(컨텍스트 = repo 루트). immutable 리포라 동일 태그가
      # 이미 있으면(재실행 등) 빌드/푸시를 건너뛰어 'tag immutable' 실패를 피한다(멱등).
      - name: Build & push image to ECR (SHA tag, immutable-safe)
        env:
          IMAGE_URI: ${{ secrets.ECR_REPOSITORY }}
        run: |
          set -e
          REPO_NAME="${IMAGE_URI##*/}"        # 풀 URI에서 리포명만 (chunbae-tour)
          if aws ecr describe-images --repository-name "$REPO_NAME" \
               --image-ids imageTag=${{ github.sha }} --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "이미지 태그 ${{ github.sha }} 가 ECR에 이미 존재(immutable) — 빌드/푸시 건너뜀"
          else
            docker build -t "$IMAGE_URI:${{ github.sha }}" .
            docker push "$IMAGE_URI:${{ github.sha }}"
          fi

      # 운영 task definition(IaC: infra/ecs/task-definition.json)에 이번 빌드 이미지(SHA)를 주입해 렌더.
      # image 외 필드(secrets/env/포트/로그/role)는 repo 파일이 정본 — 콘솔 수동변경은 이 배포로 덮인다.
      - name: Render ECS task definition (inject image SHA)
        id: render-taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/ecs/task-definition.json
          container-name: chunbae-tour
          image: ${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

      # 렌더된 task-def를 새 revision으로 등록 + ECS 서비스 업데이트(rolling). 서비스 안정화까지 대기 —
      # 새 태스크가 ALB Target Group(chunbae-tg, /actuator/health/lb) healthy가 될 때까지 기다리고,
      # 실패하면 워크플로우를 실패시킨다. 롤백: 이전 task definition revision으로 update-service 1커맨드.
      - name: Deploy to Amazon ECS (register task-def + update service)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-taskdef.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true
