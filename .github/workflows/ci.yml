name: CI

# 최소 권한 — 이 워크플로우는 checkout/build/test/artifact 업로드만 한다(코드/PR 쓰기·publish 불필요).
permissions:
  contents: read

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop ]

jobs:
  build:
    name: Build & Compile Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 메인 소스 컴파일 + assemble. 테스트 '실행'은 testcontainers(MySQL/Redis Docker)가 필요해
      # 본 CI에서는 아직 돌리지 않는다(실 test 잡은 후속). '-x test'로 test 태스크만 제외한다.
      - name: Build with Gradle (skip tests)
        run: ./gradlew build -x test --no-daemon

      # 테스트 소스 컴파일 게이트.
      #
      # WHY: 'build -x test'는 test 태스크를 그래프에서 제거하며, test에만 의존하던 compileTestJava까지
      # 함께 빠진다. 그 결과 테스트 코드가 컴파일조차 안 되는 PR이 "CI 그린"으로 머지돼 develop의
      # 테스트 컴파일을 통째로 깨뜨린 사고가 있었다(PR #275: ShopImageStorage import 누락 → #297 hotfix).
      # 이 단계는 test 소스를 '실행 없이' 컴파일만 강제해 그 사고 유형을 즉시 차단한다.
      # 테스트 '실행' 게이트는 아래 별도 'test' 잡으로 도입(2026-06). 본 build 잡은 빠른 컴파일 게이트로 유지.
      - name: Compile test sources (CI gate)
        run: ./gradlew compileTestJava --no-daemon

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: build/reports/
          retention-days: 3

  # 테스트 '실행' 게이트. build 잡(컴파일만)과 분리해 병렬 실행한다.
  # Testcontainers(MySQL 8.4 / Redis 7)는 GitHub ubuntu-latest에 기본 제공되는 Docker로 구동된다.
  # develop 전체 스위트가 green(1402 tests, 0 fail) 확인 후 도입 — 알려진 red 없어 제외 트래킹 불필요.
  test:
    name: Test (integration, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests (./gradlew test)
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7
